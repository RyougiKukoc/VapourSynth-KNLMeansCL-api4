[build-system]
requires = [
  "hatchling>=1.30",
  "packaging>=24.0",
  "meson>=0.49",
  "ninja",
  "VapourSynth>=77; platform_system == 'Windows'",
]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-knlm"
version = "1.1.1"
description = "KNLMeansCL VapourSynth plugin packaged for pip installation"
readme = "README.md"
license = { text = "GPL-3.0-only" }
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "KNLMeansCL contributors" }]
dependencies = ["VapourSynth>=77"]

[project.urls]
"Source Code" = "https://github.com/RyougiKukoc/VapourSynth-KNLMeansCL-api4"
"Releases" = "https://github.com/RyougiKukoc/VapourSynth-KNLMeansCL-api4/releases"

[tool.hatch.build.targets.sdist]
include = [
  "CHANGELOG",
  "KNLMeansCL",
  "LICENSE",
  "README.md",
  "hatch_build.py",
  "meson.build",
  "pyproject.toml",
  "readme_build.txt",
  "tools",
]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
  "vapoursynth/plugins/**/*.dll",
  "vapoursynth/plugins/**/manifest.vs",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
